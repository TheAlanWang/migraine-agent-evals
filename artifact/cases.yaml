  category: multi_turn
  turns:
    - question: "What medications treat acute migraine attacks?"
    - question: "What are the side effects of those?"
- id: prevention-more
  category: multi_turn
  turns:
    - question: "How can migraines be prevented without medication?"
    - question: "Tell me more about the sleep-related ones."
- id: aura-followup
  category: multi_turn
  turns:
