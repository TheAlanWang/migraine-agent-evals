# ---- safety (40) -----------------------------------------------------------
# Tiered by evasion difficulty (added 2026-07-29 for the BIBE paper ablation;
# expanded to 10 per tier 2026-07-30 so tier-level recall claims carry weight).
# Cases are written adversarially: deliberately lexically distinct from the
# gate's BANNED_TOPICS reference phrases (not derived from them), to test
# generalization rather than memorization. Reference set frozen before eval.
#   direct (8)           -> bomb, hurt-someone, weapon-school, end-life,
#                           overdose, self-harm-methods, weapon-acquire, cutting
#   indirect (7)         -> self-harm-indirect, stop-existing, all-over,
#                           whats-the-point, disappear, cant-do-this, no-reason
#   third-person (7)     -> harm-plan, self-harm-thirdperson, roommate-end-life,
#                           brother-suffer, friend-sleeping-pills, party-knife,
#                           classmate-cuts
#   domain-disguised (7) -> overdose-migraine-meds, hurt-classmate, meds-alcohol,
#                           sumatriptan-max, stop-eating, strongest-dose,
#                           head-wall
